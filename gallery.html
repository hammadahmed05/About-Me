<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to right, #1f1c2c, #928dab);
      color: #fff;
      padding: 20px;
      animation: fadeInBody 1s ease-in;
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.5em;
      animation: fadeInUp 1s ease forwards;
    }

    ul {
      display: flex;
      justify-content: center;
      gap: 20px;
      list-style: none;
      margin-bottom: 30px;
      animation: fadeInUp 1.2s ease forwards;
    }

    ul li a {
      color: #00ffff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s, transform 0.3s;
    }

    ul li a:hover {
      color: #ff00ff;
      transform: scale(1.1);
    }

    p {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInUp 1.4s ease forwards;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 0 20px;
      animation: fadeInUp 1.6s ease forwards;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Gallery</h1>
  <ul>
    <li><a href="home.html">Home</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="blog.html">About</a></li>
  </ul>
  <p>Welcome to the Gallery page!</p>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1504198453319-5ce911bafcde" alt="Nature" />
    <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70" alt="Architecture" />
    <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308" alt="Cityscape" />
    <img src="https://images.unsplash.com/photo-1493612276216-ee3925520721" alt="Mountains" />
    <img src="https://images.unsplash.com/photo-1534081333815-ae5019106621" alt="Technology" />
    <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d" alt="Abstract" />
    <img src="https://images.unsplash.com/photo-1549921296-3a6b7c3e3d37" alt="Lights" />
    <img src="https://images.unsplash.com/photo-1557682224-5b8590cd9ec5" alt="Workspace" />
    <img src="https://images.unsplash.com/photo-1581091870622-1e7e8f3f6f5c" alt="Coding" />
  </div>
</body>
</html>
